name: AppClaw
options:
  bundleIdPrefix: com.bareclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: UDM4W27W9V
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "6"

targets:
  AppClaw:
    type: application
    platform: iOS
    sources:
      - AppClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bareclaw.bareclaw
        INFOPLIST_KEY_CFBundleDisplayName: "BareClaw"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SDKROOT)/System/Library/Frameworks"
        OTHER_SWIFT_FLAGS: "$(inherited)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []